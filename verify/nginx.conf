server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The big, content-addressed C2PA WASM: correct MIME + long immutable cache.
  location ~ \.wasm$ {
    default_type application/wasm;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # config.js carries the backend URL (generated at container start) — never cache.
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Bare clean routes → their index.html (mirrors serve.json rewrites).
  location = /verify    { try_files /verify/index.html =404; }
  location = /sign      { try_files /sign/index.html =404; }
  location = /privacy   { try_files /privacy/index.html =404; }
  location = /faq       { try_files /faq/index.html =404; }
  location = /use-cases { try_files /use-cases/index.html =404; }

  # Share links /verify/<hash> → the verify page (real assets under /verify/ still served).
  location /verify/ {
    try_files $uri $uri/ /verify/index.html;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
