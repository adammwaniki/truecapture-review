name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend unit + integration (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # package-lock is regenerated whenever deps change; use install (not ci)
      # until the lockfile is committed alongside the dependency swap (M5b).
      - run: npm install --no-audit --no-fund
      - run: npm run coverage   # fails below the 100% threshold

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
