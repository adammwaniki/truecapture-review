# TrueCapture — full stack (backend API + static verify/sign site).
#
#   docker compose up --build
#   → backend API at http://localhost:3000  (Swagger at /docs)
#   → verify/sign site at http://localhost:8080
#
# Zero-config defaults below boot a working LOCAL stack. For real config (DeDi
# registration, CAPTCHA, OIDC, custom domains) create a .env (see .env.example) —
# it is read into the backend automatically.

services:
  backend:
    build: ./backend
    image: truecapture-backend
    # Optional: full backend config (DEDI_*, CAPTCHA_*, OIDC_*, …). Boots fine
    # without it — see .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      # Allow the verify site's origin to call the API (browser CORS). Override
      # via .env / shell for other origins (comma-separated).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      # Host port is configurable to avoid clashes (BACKEND_PORT). If you change
      # it, set VERIFY_BACKEND_URL to match so the browser targets the right port.
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # Persist the signing identity (EC chain) + the share-link store.
      - truecapture-keys:/app/.keys
    restart: unless-stopped

  verify:
    build: ./verify
    image: truecapture-verify
    environment:
      # Backend URL the browser should call. Defaults to the published backend
      # port on the host; set to your API domain for a real deploy.
      VERIFY_BACKEND_URL: ${VERIFY_BACKEND_URL:-http://localhost:3000}
    ports:
      - "${VERIFY_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  truecapture-keys:
